name: Deploy DOCX to AWS

on:
  push:
    branches:
      - main
    paths:
      - 'Projects/DOCX/**'
      - '.github/workflows/docx-editor.yml'

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Show GitHub OIDC subject
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Ref: $GITHUB_REF"
          echo "Workflow: $GITHUB_WORKFLOW"

      - name: Inspect OIDC claims safely
        run: |
          set +x
          set -e

          RESPONSE=$(curl -fsS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")

          TOKEN=$(printf '%s' "$RESPONSE" | jq -er '.value')

          export TOKEN
          python3 - <<'PY'
          import os, json, base64

          token = os.environ["TOKEN"]
          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))

          print("OIDC sub:", claims.get("sub"))
          print("OIDC aud:", claims.get("aud"))
          PY

          unset TOKEN RESPONSE

      - name: Validate AWS configuration
        env:
          ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          if [ -z "$ROLE_ARN" ]; then
            echo "::error::AWS_ROLE_ARN variable is empty or unavailable"
            exit 1
          fi

          if [[ ! "$ROLE_ARN" =~ ^arn:aws:iam::[0-9]{12}:role/.+ ]]; then
            echo "::error::AWS_ROLE_ARN is not a valid IAM role ARN"
            exit 1
          fi

          if [ -z "$AWS_REGION" ]; then
            echo "::error::AWS_REGION variable is empty or unavailable"
            exit 1
          fi

          echo "Role ARN format is valid"
          echo "AWS Region: $AWS_REGION"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Sign in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./Projects/DOCX
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:latest
            ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}
